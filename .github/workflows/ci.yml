# ==============================================================================
# File: .github/workflows/ci.yml
# Project: SuryaGharSathi (सूर्याघर साथी)
# Description: Day 12 - Continuous Integration & Continuous Delivery (CI/CD)
#              Runs automated Ruff linting, Pytest test suite, and Docker build
#              on every push and pull request to main.
# ==============================================================================

name: SuryaGharSathi CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Verify code style with Ruff
        run: |
          ruff check .

      - name: Execute automated Pytest test suite
        run: |
          pytest

  docker-build:
    name: Docker Container Build
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and validate container image
        run: |
          docker build -t suryagharsathi:latest .
