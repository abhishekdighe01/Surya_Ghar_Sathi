[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # line length handled by black/formatter

[tool.pytest.ini_options]
addopts = "-p no:langsmith -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning"
]

